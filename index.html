<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Key Converter</title>
  <style>
    /* --- RESET & VARIABEL --- */
    :root {
      --bg-color: #09090b;
      --card-bg: rgba(24, 24, 27, 0.6);
      --primary: #8b5cff;
      --primary-hover: #9d75ff;
      --accent: #00d4ff;
      --text-main: #ffffff;
      --text-muted: #a1a1aa;
      --border-color: rgba(139, 92, 255, 0.3);
      --glow: 0 0 20px rgba(139, 92, 255, 0.4);
      --success: #00e676;
      --error: #ff5252;
    }

    * {
      box-sizing: border-box;
      outline: none;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top center, #2a1a4a 0%, var(--bg-color) 70%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* --- CONTAINER UTAMA --- */
    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), var(--glow);
      position: relative;
      overflow: hidden;
    }

    /* Dekorasi latar belakang kartu */
    .container::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(to right, transparent, rgba(139, 92, 255, 0.05), transparent);
      transform: rotate(30deg);
      pointer-events: none;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    h2 {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #fff 0%, var(--primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 5px;
    }

    /* --- INPUT & OUTPUT AREA --- */
    .input-group {
      position: relative;
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
    }

    .stats {
      color: var(--accent);
    }

    textarea {
      width: 100%;
      height: 150px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 15px;
      color: #fff;
      font-family: 'Consolas', 'Monaco', monospace; /* Monospace agar key rapi */
      font-size: 14px;
      resize: none;
      transition: all 0.3s ease;
    }

    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 15px rgba(139, 92, 255, 0.2);
    }

    textarea::placeholder {
      color: rgba(255, 255, 255, 0.2);
    }

    /* --- TOMBOL --- */
    .btn-group {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button:active {
      transform: scale(0.96);
    }

    .btn-primary {
      flex: 2;
      background: linear-gradient(135deg, var(--primary), #6c2bd9);
      color: white;
      box-shadow: 0 4px 15px rgba(139, 92, 255, 0.4);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, var(--primary-hover), #7b3eea);
      box-shadow: 0 6px 20px rgba(139, 92, 255, 0.6);
    }

    .btn-secondary {
      flex: 1;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .btn-icon {
      padding: 10px;
      border-radius: 8px;
      background: transparent;
      color: var(--text-muted);
      position: absolute;
      right: 10px;
      top: 32px; /* Sesuaikan dengan tinggi label */
      cursor: pointer;
    }
    
    .btn-icon:hover {
      color: var(--primary);
    }

    /* --- CHECKBOX TOGGLE --- */
    .options {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-bottom: 15px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 20px;
      margin-left: 10px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #333;
      transition: .4s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 2px;
      bottom: 2px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--primary);
    }

    input:checked + .slider:before {
      transform: translateX(20px);
    }

    /* --- TOAST NOTIFICATION --- */
    .toast-container {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 1000;
      pointer-events: none;
    }

    .toast {
      background: rgba(20, 20, 25, 0.95);
      backdrop-filter: blur(5px);
      color: white;
      padding: 12px 24px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      gap: 10px;
      animation: slideUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .toast.success { border-left: 4px solid var(--success); }
    .toast.error { border-left: 4px solid var(--error); }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeOut {
      to { opacity: 0; transform: translateY(-10px); }
    }

    /* --- ICONS (SVG) --- */
    svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Mobile Adjustments */
    @media (max-width: 480px) {
      .container { padding: 20px; }
      h2 { font-size: 20px; }
      .btn-group { flex-direction: column; }
      button { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h2>Key Converter Pro</h2>
      <div class="subtitle">Extract & Clean Keys Instantly</div>
    </header>

    <!-- Input Section -->
    <div class="input-group">
      <label>
        Input Raw Key
        <span id="inputCount" class="stats">0 baris</span>
      </label>
      <textarea id="input" placeholder="Paste list key mentah di sini...
Contoh:
key:123456789
data:abcdef-12345"></textarea>
      <button class="btn-icon" onclick="pasteFromClipboard()" title="Paste dari Clipboard">
        <!-- Icon Clipboard -->
        <svg viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 16H5V5h14v14z"/></svg>
      </button>
    </div>

    <!-- Options -->
    <div class="options">
      <span>Auto-Copy setelah convert?</span>
      <label class="toggle-switch">
        <input type="checkbox" id="autoCopyCheck" checked>
        <span class="slider"></span>
      </label>
    </div>

    <!-- Action Buttons -->
    <div class="btn-group">
      <button class="btn-secondary" onclick="clearAll()">
        <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
        Reset
      </button>
      <button class="btn-primary" onclick="convertKey()">
        <svg viewBox="0 0 24 24"><path d="M19 8l-4 4h3c0 3.31-2.69 6-6 6-1.01 0-1.97-.25-2.8-.7l-1.46 1.46C8.97 19.54 10.43 20 12 20c4.42 0 8-3.58 8-8h3l-4-4zM6 12c0-3.31 2.69-6 6-6 1.01 0 1.97.25 2.8.7l1.46-1.46C15.03 4.46 13.57 4 12 4c-4.42 0-8 3.58-8 8H1l4 4 4-4H6z"/></svg>
        CONVERT SEKARANG
      </button>
    </div>

    <!-- Output Section -->
    <div class="input-group">
      <label>
        Hasil Bersih
        <span id="outputCount" class="stats">0 key</span>
      </label>
      <textarea id="output" readonly placeholder="Hasil key yang sudah dibersihkan akan muncul di sini..."></textarea>
      <button class="btn-icon" onclick="copyResult()" title="Salin Hasil">
        <!-- Icon Copy -->
        <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
      </button>
    </div>
  </div>

  <!-- Tempat Notifikasi Muncul -->
  <div class="toast-container" id="toastContainer"></div>

  <script>
    // --- FUNGSI UTAMA ---

    // Fungsi Convert Key
    function convertKey() {
      const input = document.getElementById("input").value;
      const isAutoCopy = document.getElementById("autoCopyCheck").checked;

      // Validasi Input Kosong
      if (!input.trim()) {
        showToast("Input masih kosong, masukkan key dulu!", "error");
        return;
      }

      // Logika Split dan Filter
      // 1. Pecah berdasarkan baris baru
      // 2. Ambil bagian setelah titik dua (:) jika ada
      // 3. Hapus karakter aneh (hanya biarkan huruf, angka, dan strip)
      let lines = input.split("\n");
      let results = [];

      lines.forEach(line => {
        let processed = line.trim();
        
        if (processed.includes(":")) {
          // Ambil bagian setelah colon terakhir
          processed = processed.split(":").pop().trim();
        }

        // Bersihkan karakter non-alphanumeric (kecuali strip/hyphen)
        processed = processed.replace(/[^0-9A-Za-z-]/g, "").trim();

        if (processed.length > 0) {
          results.push(processed);
        }
      });

      // Update UI Output
      const outputField = document.getElementById("output");
      outputField.value = results.join("\n");
      
      // Update Counter Output
      document.getElementById("outputCount").innerText = `${results.length} key`;

      // Feedback Visual
      if (results.length > 0) {
        showToast(`Berhasil convert ${results.length} key!`, "success");
        
        // Fitur Auto-Copy
        if (isAutoCopy) {
          copyToClipboard(results.join("\n"));
        }
      } else {
        showToast("Tidak ada key valid yang ditemukan.", "error");
      }
    }

    // Fungsi Copy Manual
    function copyResult() {
      const output = document.getElementById("output").value;
      if (!output) {
        showToast("Tidak ada hasil untuk disalin.", "error");
        return;
      }
      copyToClipboard(output);
    }

    // Fungsi Helper Copy ke Clipboard (Modern API)
    async function copyToClipboard(text) {
      try {
        await navigator.clipboard.writeText(text);
        showToast("Disalin ke clipboard!", "success");
      } catch (err) {
        // Fallback jika API gagal (browser lama)
        const textarea = document.getElementById("output");
        textarea.select();
        document.execCommand("copy");
        showToast("Disalin ke clipboard!", "success");
      }
    }

    // Fungsi Paste dari Clipboard
    async function pasteFromClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        document.getElementById("input").value = text;
        updateInputCount();
        showToast("Teks berhasil dipaste!", "success");
      } catch (err) {
        showToast("Gagal membaca clipboard. Izinkan akses browser.", "error");
      }
    }

    // Fungsi Reset
    function clearAll() {
      document.getElementById("input").value = "";
      document.getElementById("output").value = "";
      document.getElementById("inputCount").innerText = "0 baris";
      document.getElementById("outputCount").innerText = "0 key";
      showToast("Formulir di-reset.", "success");
    }

    // --- UTILITIES ---

    // Hitung jumlah baris input secara realtime
    document.getElementById("input").addEventListener("input", updateInputCount);

    function updateInputCount() {
      const val = document.getElementById("input").value;
      const count = val ? val.split("\n").length : 0;
      document.getElementById("inputCount").innerText = `${count} baris`;
    }

    // Sistem Notifikasi (Toast)
    function showToast(message, type = "success") {
      const container = document.getElementById("toastContainer");
      const toast = document.createElement("div");
      
      toast.className = `toast ${type}`;
      toast.innerHTML = `
        <span>${message}</span>
      `;

      container.appendChild(toast);

      // Hapus toast setelah 3 detik
      setTimeout(() => {
        toast.style.animation = "fadeOut 0.3s forwards";
        toast.addEventListener("animationend", () => {
          toast.remove();
        });
      }, 3000);
    }
  </script>

</body>
</html>
